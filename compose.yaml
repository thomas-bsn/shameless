# Instance Shameless complète : base, migration, API et reverse proxy.
# Uniquement des images, des volumes nommés et une configuration par .env.
name: shameless

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shameless}
      POSTGRES_USER: ${POSTGRES_USER:-shameless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${SHAMELESS_IMAGE_PREFIX:-shameless}-migrate:${SHAMELESS_VERSION:-local}
    build:
      context: ./api
      target: migrate
    environment:
      ConnectionStrings__Shameless: Host=postgres;Database=${POSTGRES_DB:-shameless};Username=${POSTGRES_USER:-shameless};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${SHAMELESS_IMAGE_PREFIX:-shameless}-api:${SHAMELESS_VERSION:-local}
    build:
      context: ./api
      target: api
    restart: unless-stopped
    environment:
      ConnectionStrings__Shameless: Host=postgres;Database=${POSTGRES_DB:-shameless};Username=${POSTGRES_USER:-shameless};Password=${POSTGRES_PASSWORD}
      Auth__Discord__ClientId: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID est requis}
      Auth__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET est requis}
      Auth__Discord__AllowedGuildId: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID est requis}
      Auth__Discord__RedirectUri: ${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI est requis}
      Auth__AllowedReturnOrigins: ${AUTH_ALLOWED_RETURN_ORIGINS:-}
      Auth__AdminDiscordIds: ${ADMIN_DISCORD_IDS:-}
      Auth__SessionLifetimeDays: ${SESSION_LIFETIME_DAYS:-14}
      Auth__Riot__ApiKey: ${RIOT_API_KEY:-}
      DataProtection__KeysPath: /keys
    volumes:
      - api-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  proxy:
    image: ${SHAMELESS_IMAGE_PREFIX:-shameless}-proxy:${SHAMELESS_VERSION:-local}
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    environment:
      SHAMELESS_SITE_ADDRESS: ${SHAMELESS_SITE_ADDRESS:-:80}
    ports:
      - "${SHAMELESS_HTTP_PORT:-8080}:80"
      - "${SHAMELESS_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  api-keys:
  caddy-data:
  caddy-config:
