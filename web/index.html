<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shameless</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applique le thème choisi avant le premier rendu, pour ne pas clignoter : même clé que lib/theme.ts.
      try {
        if (localStorage.getItem("shameless-theme") === "light") document.documentElement.classList.remove("dark");
      } catch {
        // Stockage refusé (mode privé) : le thème sombre par défaut reste en place.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
