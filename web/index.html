<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shameless</title>
    <script>
      // Pose le thème choisi avant le premier rendu, pour éviter un flash (sombre par défaut).
      try {
        if (localStorage.getItem("shameless-theme") === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
