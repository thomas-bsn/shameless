name: Publication des images

# Publie les images Shameless dans GHCR quand un tag de version vX.Y.Z est poussé.
# Tags d'image : X.Y.Z (reproductible), X.Y, et latest (tag stable) pour les versions
# non préversion. Un tag vX.Y.Z-rc.1 ne pose ni latest ni X.Y.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            target: api
          - name: migrate
            context: api
            target: migrate
          - name: proxy
            context: deploy/caddy
            build-contexts: web=./web
          - name: wizard
            context: wizard
            build-contexts: web=./web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR exige des minuscules : github.repository_owner peut en contenir.
          images: ghcr.io/${{ github.repository_owner }}/shameless-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
