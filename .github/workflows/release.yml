name: Publication des images

# Publication manuelle : publie les images Shameless dans GHCR quand un tag de version vX.Y.Z
# est poussé à la main (dont les préversions vX.Y.Z-rc.N). La construction est dans
# publier-images.yml. La publication à chaque merge sur main est dans publication-auto.yml ;
# le tag qu'elle pose avec le GITHUB_TOKEN ne déclenche pas ce workflow (règle GitHub : pas de
# workflow déclenché par un événement du GITHUB_TOKEN), donc pas de double publication.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Publier ${{ github.ref_name }}
    uses: ./.github/workflows/publier-images.yml
    with:
      version: ${{ github.ref_name }}
      ref: ${{ github.sha }}
