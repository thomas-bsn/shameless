name: Publication automatique

# À chaque CI vert sur main : calcule la version suivante, pose le tag vX.Y.Z sur le commit testé
# puis publie les quatre images (publier-images.yml) dans le même run.
# Version : +patch par défaut ; +minor / +major si la PR mergée porte le label ou « [minor] » /
# « [major] » dans son titre (voir .github/scripts/prochaine-version.sh).
#
# Pas de boucle : le tag est poussé avec le GITHUB_TOKEN, qui ne déclenche aucun workflow
# (donc pas release.yml). Ne pas le remplacer par un PAT sans exclure ce workflow de release.yml.
# Les tags manuels (dont -rc.N) restent publiés par release.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Une publication à la fois : deux merges rapprochés ne se disputent pas le même numéro de version.
concurrency:
  group: publication-auto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version et tag
    # Uniquement un push sur main dont la CI est verte (jamais une PR, jamais une CI en échec).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.calcul.outputs.version }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Le commit testé par la CI, pas la pointe actuelle de main.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculer la version et poser le tag
        id: calcul
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # Commit déjà tagué (relance du workflow) : on republie cette version, sans nouveau bump.
          existant=$(git tag --points-at "$SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n $existant ]]; then
            echo "Le commit porte déjà $existant : republication sans bump."
            echo "version=${existant#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR mergée qui a produit ce commit (titre et labels).
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.SHA)] | (.[0] // empty)')
          [[ -n $pr ]] || pr='{}'
          titre=$(jq -r '.title // ""' <<<"$pr")
          labels=$(jq -r '[.labels[]?.name] | join("\n")' <<<"$pr")
          echo "PR : ${titre:-aucune (push direct)} ; labels : ${labels//$'\n'/, }"

          version=$(.github/scripts/prochaine-version.sh "$titre" "$labels")
          echo "Version suivante : v$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" "$SHA" -m "Version $version"
          git push origin "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publier:
    name: Publier v${{ needs.version.outputs.version }}
    needs: version
    uses: ./.github/workflows/publier-images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
