name: CI

# Un seul workflow : les tests, puis (push sur main ou lancement manuel) la version, son tag git et la
# publication des quatre images Shameless (api, migrate, proxy, wizard) dans GHCR.
#
# 1. Automatique : à chaque push sur main dont tous les jobs de test sont verts, calcule la version
#    suivante (+patch par défaut ; +minor / +major si la PR mergée porte le label ou « [minor] » /
#    « [major] » dans son titre, voir .github/scripts/prochaine-version.sh), pose le tag vX.Y.Z sur le
#    commit testé et publie. Un commit déjà tagué est republié sans nouveau bump.
# 2. Manuel : bouton « Run workflow » avec une version (0.2.0-rc.1 ou 0.2.0, sans le v). Les tests
#    passent d'abord, puis la publication a lieu avec ce tag exact, et le tag git vX.Y.Z est posé sur le
#    commit de la branche choisie, sans calcul.
#
# Tags d'image : X.Y.Z, puis X.Y et latest pour les versions stables (jamais pour une préversion).
# Aucun déclencheur sur « push: tags » : le tag posé ici ne relance rien.
#
# Companion : après la version, un push sur main qui change l'exécutable (voir
# .github/scripts/companion-a-change.sh) publie shameless-companion.exe (Windows, un seul fichier) en
# GitHub Release sur le tag vX.Y.Z. Le nom du fichier est fixe : releases/latest/download/shameless-companion.exe
# donne toujours le plus récent. Le dépôt ne crée aucune autre Release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.2.0-rc.1 ou 0.2.0). Le tag git vX.Y.Z est posé sur le commit de la branche choisie."
        required: true
        type: string

# Seules les PR annulent leur run précédent : un run sur main peut être en train de publier.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (build et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore Shameless.sln

      - name: Build
        run: dotnet build Shameless.sln --no-restore -c Release

      # Les tests d'intégration démarrent un Postgres via Testcontainers (Docker est fourni par le runner).
      # ContractTests échoue si contracts/openapi.json ne correspond plus à l'API.
      - name: Test
        run: dotnet test --solution Shameless.sln --no-build -c Release

  web:
    name: Front (lint, typecheck, tests et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Client généré à jour
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts || (echo "::error::Client TypeScript obsolète : lancer npm run gen:api" && exit 1)

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Arbre des routes à jour
        run: git diff --exit-code -- src/routeTree.gen.ts

  companion:
    name: Companion (build et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: companion/global.json

      # L'app Avalonia et son stockage DPAPI se compilent sous Linux ; seule la logique est testée ici.
      - name: Build
        run: dotnet build Shameless.Companion.slnx -c Release

      - name: Test
        run: dotnet test --solution Shameless.Companion.slnx --no-build -c Release

      - name: Test du script qui décide de publier l'exécutable
        working-directory: .
        run: tests/deploy/companion-a-change.test.sh

  images:
    name: Images du compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Calcul de version (publication automatique)
        run: tests/deploy/prochaine-version.test.sh

      - name: Vérifier la publication et le compose de déploiement
        run: tests/deploy/verifier-publication.sh

      # Le même compose.yaml doit passer tel quel dans Forgeyard et dans Docker Compose.
      - name: Compatibilité Forgeyard du compose
        run: node tests/compose/forgeyard-compat.mjs

      # Aucune variable d'Instance n'est requise : le wizard les collecte au premier démarrage.
      - name: Build
        run: docker compose build

  wizard:
    name: Wizard (typecheck et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wizard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  compose-acceptance:
    name: Acceptation Compose (installation par le wizard)
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5

      # Compose vierge -> wizard -> site accessible et connexion Discord possible (images construites ici).
      - name: Parcours d'installation
        run: tests/compose/acceptance.sh

  version:
    name: Version et tag
    # Après tous les jobs de test, sur un push sur main ou à la main (jamais sur une PR).
    needs: [api, web, companion, images, wizard, compose-acceptance]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Une publication à la fois, sans annuler celle en cours : deux merges rapprochés ne se
    # disputent pas le même numéro de version.
    concurrency:
      group: publier-images
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.calcul.outputs.version }}
      sha: ${{ steps.calcul.outputs.sha }}
    steps:
      # Le commit testé par ce run : sur main, celui du push ; en manuel, la pointe de la branche choisie.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculer la version et poser le tag
        id: calcul
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Saisie utilisateur : par l'environnement, jamais interpolée dans le script.
          VERSION_SAISIE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [[ $EVENT == workflow_dispatch ]]; then
            version=$VERSION_SAISIE
            if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version invalide « $version » : attendu X.Y.Z ou X.Y.Z-rc.N, sans le v."
              exit 1
            fi
            # Le tag existe déjà : accepté seulement s'il pointe sur ce commit (republication).
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              if [[ $(git rev-list -n 1 "v$version") != "$SHA" ]]; then
                echo "::error::Le tag v$version existe déjà sur un autre commit."
                exit 1
              fi
              echo "Le tag v$version est déjà sur ce commit : republication."
            else
              git tag -a "v$version" "$SHA" -m "Version $version"
              git push origin "refs/tags/v$version"
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commit déjà tagué (relance du workflow) : on republie cette version, sans nouveau bump.
          existant=$(git tag --points-at "$SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n $existant ]]; then
            echo "Le commit porte déjà $existant : republication sans bump."
            echo "version=${existant#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR mergée qui a produit ce commit (titre et labels).
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.SHA)] | (.[0] // empty)')
          [[ -n $pr ]] || pr='{}'
          titre=$(jq -r '.title // ""' <<<"$pr")
          labels=$(jq -r '[.labels[]?.name] | join("\n")' <<<"$pr")
          echo "PR : ${titre:-aucune (push direct)} ; labels : ${labels//$'\n'/, }"

          version=$(.github/scripts/prochaine-version.sh "$titre" "$labels")
          echo "Version suivante : v$version"

          git tag -a "v$version" "$SHA" -m "Version $version"
          git push origin "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publier-images:
    name: Publication de l'image ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            target: api
          - name: migrate
            context: api
            target: migrate
          - name: web
            context: deploy/caddy
            build-contexts: web=./web
          - name: wizard
            context: wizard
            build-contexts: web=./web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      # La version passe par l'environnement, jamais interpolée dans le script.
      - name: Versions à publier
        id: versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version=${VERSION#v}
          if [[ ! $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version invalide : $VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "serie=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          if [[ -z ${BASH_REMATCH[4]} ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR exige des minuscules : github.repository_owner peut en contenir.
          images: ghcr.io/${{ github.repository_owner }}/shameless-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.version }}
            type=raw,value=${{ steps.versions.outputs.serie }},enable=${{ steps.versions.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.versions.outputs.stable }}
          flavor: |
            latest=false

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publier-companion:
    name: Publication de l'exécutable du Companion
    needs: version
    # Seulement sur un push sur main (pas en lancement manuel, qui publie les images d'une version choisie).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Une publication à la fois : la plus récente passe en dernier, donc « latest » reste la plus récente.
    concurrency:
      group: publier-companion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      # On compare au commit de la dernière Release, pas au push précédent : un changement du Companion
      # resté sans publication (CI rouge, push intermédiaire) est repris au push suivant.
      # Aucune Release : on publie.
      - name: L'exécutable a-t-il changé depuis la dernière Release ?
        id: changement
        env:
          GH_TOKEN: ${{ github.token }}
          APRES: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          derniere=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ -z $derniere ]]; then
            echo "Aucune Release : publication."
            echo "publier=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          avant=$(git rev-list -n 1 "$derniere")
          resultat=$(.github/scripts/companion-a-change.sh "$avant" "$APRES")
          echo "Depuis $derniere : changement de l'exécutable = $resultat"
          if [[ $resultat == oui ]]; then echo "publier=true" >> "$GITHUB_OUTPUT"; else echo "publier=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v5
        if: steps.changement.outputs.publier == 'true'
        with:
          global-json-file: companion/global.json

      # Les options (Windows 64 bits, un seul fichier, bibliothèques natives comprises) sont dans le profil
      # companion/src/Shameless.Companion.App/Properties/PublishProfiles/Windows.pubxml : les changer compte
      # comme un changement de l'exécutable.
      - name: Construire l'exécutable Windows
        if: steps.changement.outputs.publier == 'true'
        working-directory: companion
        run: dotnet publish src/Shameless.Companion.App/Shameless.Companion.App.csproj -p:PublishProfile=Windows -o publish

      # Le nom du fichier est fixe (l'URL « latest » du site en dépend). Un renvoi du même tag remplace le fichier.
      - name: Publier la Release
        if: steps.changement.outputs.publier == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          exe=companion/publish/Shameless.Companion.App.exe
          [[ -f $exe ]] || { echo "::error::$exe absent : dotnet publish n'a pas produit l'exécutable attendu."; exit 1; }
          cp "$exe" shameless-companion.exe
          if sortie=$(gh release view "v$VERSION" 2>&1); then
            gh release upload "v$VERSION" shameless-companion.exe --clobber
          elif grep -qi 'not found' <<<"$sortie"; then
            gh release create "v$VERSION" shameless-companion.exe \
              --title "Companion $VERSION" --latest \
              --notes "Exécutable Windows du Companion (Windows 10/11 seulement). Il n'est pas signé : Windows affiche un avertissement « éditeur inconnu » au premier lancement."
          else
            echo "::error::Lecture de la Release v$VERSION impossible : $sortie"
            exit 1
          fi
