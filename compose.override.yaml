# Surcharge de dev : chargée automatiquement par `docker compose` depuis un clone du dépôt.
# Elle construit les images depuis les sources au lieu de les tirer de GHCR, et publie le proxy
# (compose.yaml n'a pas de `ports`, pour rester valide dans Forgeyard).
# Pour utiliser les images publiées, sans build :
#   docker compose -f compose.yaml -f compose.ports.yaml up -d
name: shameless

services:
  migrate:
    image: shameless-migrate:local
    build:
      context: ./api
      target: migrate

  api:
    image: shameless-api:local
    build:
      context: ./api
      target: api

  proxy:
    image: shameless-proxy:local
    ports:
      - "${SHAMELESS_HTTP_PORT:-8080}:80"
      - "${SHAMELESS_HTTPS_PORT:-8443}:443"
    build:
      context: ./deploy/caddy
      additional_contexts:
        web: ./web

  wizard:
    image: shameless-wizard:local
    build:
      context: ./wizard
      additional_contexts:
        web: ./web
